<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3038" stop-opacity="0"/>
      <stop offset="1" stop-color="#2b3038" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- transparent background: ZCode's marketplace inverts icons drawn for light mode
       (NIGHT_READER_INVERSION_FILTER), so the glyph must be dark-on-clear, never a tile -->

  <!-- incoming white beam -->
  <line x1="76" y1="238" x2="196" y2="252" stroke="#23272d" stroke-opacity="0.18" stroke-width="26" stroke-linecap="round"/>
  <line x1="76" y1="238" x2="196" y2="252" stroke="url(#beam)" stroke-width="14" stroke-linecap="round"/>

  <!-- prism -->
  <path d="M256 128 L366 344 L146 344 Z" fill="#30353c" fill-opacity="0.05" stroke="#3d434b" stroke-width="16" stroke-linejoin="round"/>

  <!-- dispersed spectrum -->
  <g stroke-linecap="round">
    <g stroke-width="22" stroke-opacity="0.16">
      <line x1="324" y1="262" x2="438" y2="166" stroke="#f43f5e"/>
      <line x1="328" y1="270" x2="446" y2="214" stroke="#fb923c"/>
      <line x1="332" y1="278" x2="450" y2="262" stroke="#fde047"/>
      <line x1="337" y1="288" x2="450" y2="310" stroke="#34d399"/>
      <line x1="341" y1="296" x2="446" y2="358" stroke="#60a5fa"/>
      <line x1="345" y1="304" x2="438" y2="406" stroke="#a78bfa"/>
    </g>
    <g stroke-width="12">
      <line x1="324" y1="262" x2="438" y2="166" stroke="#f43f5e"/>
      <line x1="328" y1="270" x2="446" y2="214" stroke="#fb923c"/>
      <line x1="332" y1="278" x2="450" y2="262" stroke="#fde047"/>
      <line x1="337" y1="288" x2="450" y2="310" stroke="#34d399"/>
      <line x1="341" y1="296" x2="446" y2="358" stroke="#60a5fa"/>
      <line x1="345" y1="304" x2="438" y2="406" stroke="#a78bfa"/>
    </g>
  </g>
</svg>
