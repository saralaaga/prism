<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24272a"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- incoming white beam -->
  <line x1="76" y1="238" x2="196" y2="252" stroke="#ffffff" stroke-opacity="0.14" stroke-width="26" stroke-linecap="round"/>
  <line x1="76" y1="238" x2="196" y2="252" stroke="url(#beam)" stroke-width="14" stroke-linecap="round"/>

  <!-- prism -->
  <path d="M256 128 L366 344 L146 344 Z" fill="#ffffff" fill-opacity="0.05" stroke="#d9dce0" stroke-width="16" stroke-linejoin="round"/>

  <!-- dispersed spectrum -->
  <g stroke-linecap="round">
    <g stroke-width="22" stroke-opacity="0.16">
      <line x1="324" y1="262" x2="438" y2="166" stroke="#f43f5e"/>
      <line x1="328" y1="270" x2="446" y2="214" stroke="#fb923c"/>
      <line x1="332" y1="278" x2="450" y2="262" stroke="#fde047"/>
      <line x1="337" y1="288" x2="450" y2="310" stroke="#34d399"/>
      <line x1="341" y1="296" x2="446" y2="358" stroke="#60a5fa"/>
      <line x1="345" y1="304" x2="438" y2="406" stroke="#a78bfa"/>
    </g>
    <g stroke-width="12">
      <line x1="324" y1="262" x2="438" y2="166" stroke="#f43f5e"/>
      <line x1="328" y1="270" x2="446" y2="214" stroke="#fb923c"/>
      <line x1="332" y1="278" x2="450" y2="262" stroke="#fde047"/>
      <line x1="337" y1="288" x2="450" y2="310" stroke="#34d399"/>
      <line x1="341" y1="296" x2="446" y2="358" stroke="#60a5fa"/>
      <line x1="345" y1="304" x2="438" y2="406" stroke="#a78bfa"/>
    </g>
  </g>
</svg>
